services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://licensing:licensing@postgres:5432/licensing_portal?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: licensing_portal
      POSTGRES_USER: licensing
      POSTGRES_PASSWORD: licensing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licensing -d licensing_portal"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:

