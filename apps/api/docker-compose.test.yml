services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: licensing_portal_test
      POSTGRES_USER: licensing_test
      POSTGRES_PASSWORD: licensing_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licensing_test -d licensing_portal_test"]
      interval: 2s
      timeout: 3s
      retries: 30

