<div class="p-6">
  <h2 class="text-lg font-semibold text-gray-900">{{ data.title }}</h2>
  <p class="mt-2 text-sm text-gray-600">{{ data.message }}</p>
  <div class="mt-6 flex justify-end gap-2">
    <app-button variant="secondary" (click)="close(false)">Cancel</app-button>
    <app-button [variant]="data.variant ?? 'primary'" (click)="close(true)">
      {{ data.confirmLabel ?? 'Confirm' }}
    </app-button>
  </div>
</div>
