<div
  class="flex min-h-44 flex-col items-center justify-center gap-3 rounded-lg border border-red-100 bg-red-50 p-6 text-center"
>
  <mat-icon class="text-red-600" aria-hidden="true">error_outline</mat-icon>
  <div>
    <p class="text-sm font-semibold text-red-900">{{ title }}</p>
    <p class="text-sm text-red-700">{{ message }}</p>
  </div>
  <app-button variant="secondary" icon="refresh" (click)="retry.emit()">Retry</app-button>
</div>
