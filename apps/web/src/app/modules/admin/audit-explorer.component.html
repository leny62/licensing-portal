<div class="page-shell">
  <header class="page-header">
    <div>
      <h1 class="page-title">Audit explorer</h1>
      <p class="page-copy">Inspect and verify the chain for an application.</p>
    </div>
  </header>

  <section class="surface p-5">
    <form [formGroup]="form" class="flex flex-wrap items-end gap-3" (ngSubmit)="load()">
      <div class="min-w-[320px] flex-1">
        <app-inputs [field]="appIdField" [group]="form"></app-inputs>
      </div>
      <div class="flex shrink-0 gap-2 pb-px">
        <app-button type="submit" icon="history" [loading]="isLoading">Load</app-button>
        <app-button
          type="button"
          variant="secondary"
          icon="verified"
          [loading]="isVerifying"
          (click)="verify()"
        >
          Verify chain
        </app-button>
      </div>
    </form>

    @if (verification) {
      <p
        class="mt-4 rounded-xl border px-4 py-2.5 text-sm font-semibold"
        [class.border-green-200]="verification.valid"
        [class.bg-green-50]="verification.valid"
        [class.text-green-800]="verification.valid"
        [class.border-amber-200]="!verification.valid"
        [class.bg-amber-50]="!verification.valid"
        [class.text-amber-800]="!verification.valid"
      >
        @if (verification.valid) {
          Chain verified across {{ verification.checkedEntries }} entries.
        } @else {
          {{ verification.reason ?? 'Verification failed.' }}
        }
      </p>
    }
  </section>

  @if (hasError) {
    <app-error-state
      title="Audit entries unavailable"
      [message]="errorMessage"
      (retry)="load(currentPage)"
    ></app-error-state>
  } @else {
    <app-table
      [config]="tableConfig"
      [data]="entries"
      [isLoading]="isLoading"
      [serverSide]="true"
      [showSearch]="false"
      [showFilter]="false"
      [pageSize]="pageSize"
      [totalRecords]="totalRecords"
      [totalPages]="totalPages"
      (actionClick)="handleAction($event)"
      (pageChange)="handlePage($event)"
    ></app-table>
  }
</div>
