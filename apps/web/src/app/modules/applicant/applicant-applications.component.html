<div class="page-shell">
  <header class="page-header">
    <div>
      <h1 class="page-title">My applications</h1>
      <p class="page-copy">Create drafts, submit applications, and track review progress.</p>
    </div>
    <app-button icon="add" (click)="create()">Create application</app-button>
  </header>

  @if (hasError) {
    <app-error-state (retry)="load()"></app-error-state>
  } @else {
    <app-table
      [config]="config"
      [data]="applications"
      [isLoading]="isLoading"
      [totalRecords]="totalRecords"
      [totalPages]="totalPages"
      (actionClick)="handleAction($event)"
      (searchChange)="handleSearch($event)"
      (filtersChange)="handleFilters($event)"
      (pageChange)="handlePage($event)"
      [showEmptyAction]="true"
      emptyActionLabel="Create application"
      (emptyActionClick)="create()"
    ></app-table>
  }
</div>
