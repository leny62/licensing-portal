<main class="mfa-page grid min-h-screen place-items-center px-4 py-8">
  <section
    class="w-full max-w-[480px] rounded-2xl border border-slate-200 bg-white p-8 shadow-[0_28px_70px_rgb(15_23_42/0.10),0_1px_2px_rgb(15_23_42/0.04)]"
    aria-label="Two-factor authentication"
  >
    <div class="flex items-center gap-3.5">
      <div
        class="grid h-10 w-10 shrink-0 place-items-center rounded-[10px] bg-brand-navy text-[0.85rem] font-extrabold text-white"
      >
        BL
      </div>
      <div>
        <p class="m-0 text-[0.7rem] font-extrabold uppercase tracking-tight text-slate-400">
          Bank Licensing
        </p>
        <p class="m-0 mt-px text-[0.95rem] font-[750] text-slate-900">Licensing Portal</p>
      </div>
    </div>

    <div class="my-6 h-px bg-slate-100"></div>

    <div class="mb-5">
      <p class="m-0 text-[0.72rem] font-extrabold uppercase tracking-tight text-brand-amber">
        Step 2 of 2
      </p>
      <h1 class="m-0 mt-1 text-[1.35rem] font-extrabold tracking-tight text-slate-900">
        Two-factor authentication
      </h1>
      <p class="m-0 mt-1.5 text-[0.9rem] leading-relaxed text-slate-500">
        Enter your TOTP code or a single-use recovery code to continue.
      </p>
    </div>

    <form [formGroup]="form" class="flex flex-col gap-4" (ngSubmit)="submit()">
      <app-inputs [field]="codeField" [group]="form"></app-inputs>

      @if (errorMessage()) {
        <p
          class="m-0 flex items-start gap-2 rounded-xl border border-red-200 bg-red-50 px-3.5 py-3 text-[0.85rem] font-semibold text-red-700"
          aria-live="polite"
        >
          <mat-icon class="mt-px h-[19px] w-[19px] shrink-0 text-[19px]" aria-hidden="true"
            >error_outline</mat-icon
          >
          <span>{{ errorMessage() }}</span>
        </p>
      }

      <app-button
        class="mfa-submit mt-1 block"
        type="submit"
        variant="primary"
        [loading]="isLoading()"
      >
        Verify
      </app-button>

      <app-button
        class="mfa-submit block"
        type="button"
        variant="ghost"
        [disabled]="isLoading()"
        (click)="backToLogin()"
      >
        Return to login
      </app-button>
    </form>

    <p class="mt-5 border-t border-slate-100 pt-4 text-center text-[0.78rem] text-slate-400">
      Recovery codes are single-use. Protect them like a password.
    </p>
  </section>
</main>
