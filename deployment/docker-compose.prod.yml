name: licensing-portal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./production.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  migrate:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: build
    image: licensing-portal-api-migrate:${APP_IMAGE_TAG:-prod}
    restart: "no"
    env_file:
      - ./production.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      SWAGGER_ENABLED: "false"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: licensing-portal-api:${APP_IMAGE_TAG:-prod}
    restart: unless-stopped
    env_file:
      - ./production.env
    environment:
      DATABASE_URL: postgresql://licensing_app:${LICENSING_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      DATABASE_URL_MIGRATION: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      DOCUMENT_STORAGE_ROOT: /data/documents
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      SNAPSHOT_DESTINATION: /data/snapshots
      SWAGGER_ENABLED: "false"
    volumes:
      - document_storage:/data/documents
      - audit_snapshots:/data/snapshots
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web
    image: licensing-portal-web:${APP_IMAGE_TAG:-prod}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
      - /var/cache/nginx:noexec,nosuid,size=32m
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  audit_snapshots:
  document_storage:
  postgres_data:
